
name: mirrormood
description: "MirrorMood - Tu espejo inteligente para descubrir tu estilo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  shared_preferences: ^2.5.6
  geolocator: ^14.1.1
  http: ^1.6.0
  table_calendar: ^3.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
